<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Crisp White Canvas -->
  <rect width="512" height="512" fill="#FFFFFF" />

  <!-- Double Diamond Emblem -->
  <!-- Left Diamond -->
  <polygon
    points="12,256 134,180 256,256 134,332"
    fill="#FFFFFF"
    stroke="#0F0F0F"
    stroke-width="14"
    stroke-linejoin="miter"
  />
  <!-- Right Diamond -->
  <polygon
    points="256,256 378,180 500,256 378,332"
    fill="#FFFFFF"
    stroke="#0F0F0F"
    stroke-width="14"
    stroke-linejoin="miter"
  />

  <!-- Bold Clean Text -->
  <text
    x="134" y="266"
    text-anchor="middle"
    font-family="'Arial Black', 'Segoe UI Black', Impact, 'Roboto', Arial, sans-serif"
    font-size="32"
    font-weight="900"
    fill="#0F0F0F"
    letter-spacing="0.5"
  >
    DOUBLE
  </text>
  <text
    x="378" y="266"
    text-anchor="middle"
    font-family="'Arial Black', 'Segoe UI Black', Impact, 'Roboto', Arial, sans-serif"
    font-size="31"
    font-weight="900"
    fill="#0F0F0F"
    letter-spacing="0.5"
  >
    DIAMOND
  </text>
</svg>